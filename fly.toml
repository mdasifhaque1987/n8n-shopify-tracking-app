# Fly.io configuration for Unified Tracking SaaS Platform

app = "dh-tracking-app-new"
primary_region = "ord" # Chicago (adjust based on your target market)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SHOPIFY_API_KEY = "01d0cb4c46e0f4e614878f18de894cd6"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "5s"
    interval = "10s"
    method = "get"
    path = "/healthz"
    protocol = "http"
    timeout = "2s"
    tls_skip_verify = false

# VM resources
[compute]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Persistent volume for SQLite (if used as fallback)
[mounts]
  source = "data"
  destination = "/data"

# Metrics
[metrics]
  port = 9091
  path = "/metrics"
